<!DOCTYPE html>
<html lang="{{ site.lang | default: 'zh-CN' }}">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% if page.title and page.title != "Home" %}{{ page.title }} | {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ site.description }}" />
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>
<body>
  <canvas id="fluid-canvas"></canvas>

  <header class="site-header">
    <a class="brand" href="{{ '/' | relative_url }}">denXpinn</a>
    <nav class="site-nav">
      <a href="{{ '/' | relative_url }}">首页</a>
      <a href="{{ '/archive/' | relative_url }}">文章</a>
      <a href="https://github.com/eveningzhang" target="_blank" rel="noreferrer">GitHub</a>
    </nav>
  </header>

  <main class="page-shell">
    {{ content }}
  </main>

  <div id="kuromi-widget" title="点我互动～">
    <img src="{{ '/assets/images/kuromi.png' | relative_url }}" alt="Kuromi" id="kuromi-img" />
    <div class="kuromi-bubble" id="kuromi-bubble">Hi，我是库洛米～</div>
  </div>

  <script src="{{ '/assets/js/main.js' | relative_url }}"></script>
</body>
</html>
